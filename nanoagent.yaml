_ > nanoagent.plugin.v0001.ManifestConfig:
id: pubmed-related-paper
name: PubMed Related Paper
version: 0.1.1
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: [eutils.ncbi.nlm.nih.gov]
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  most_related_paper:
    description: Return the other PubMed article with the highest ELink neighbor score for a PMID.
  pin_related_paper:
    description: Pin that same neighbor before the task runs, as the answer key.

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  pubmed-related-paper:
    description: Return the PubMed article most related to a PMID.
    runner: tool
    tools: [most_related_paper]
    reference: pin_related_paper
    instructions: Call most_related_paper once with the PMID, and return that tool's related_pmid and neighbor_score unchanged.
